<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'">
<title>File not found · Alvin Diaz Merasol</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A111E">
<link rel="icon" href="/website/assets/img/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Archivo";src:url(/website/assets/fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(/website/assets/fonts/plex-sans-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(/website/assets/fonts/plex-sans-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(/website/assets/fonts/plex-mono-500.woff2) format("woff2");font-weight:500;font-display:swap}
:root{--bg:#0A111E;--fg:#E6EAF2;--fg-2:#A3AEC2;--fg-3:#8492AB;--paper:#E8EBF0;--ink:#121927;--amber:#F2A516;--on-amber:#1B1203;--stamp:#B7362A;--rule:rgba(160,178,210,.3);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#ECEFF3;--fg:#0E1524;--fg-2:#3D485C;--fg-3:#566176;--paper:#FFFFFF;--rule:rgba(14,21,36,.24);color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--fg);font:400 16px/1.6 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:560px}
.lbl{font:500 11.5px/1.3 "IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.sheet{position:relative;margin-top:14px;background:var(--paper);color:var(--ink);border-radius:2px;padding:clamp(22px,5vw,36px);box-shadow:0 24px 48px -24px rgba(0,0,0,.6)}
.tab{position:absolute;top:-26px;left:18px;height:26px;padding:0 14px;display:flex;align-items:center;background:#2C4A7C;color:#fff;border-radius:4px 4px 0 0;font:600 12px "IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;font:900 clamp(2rem,8vw,3.4rem)/.95 "Archivo","Arial Narrow",system-ui,sans-serif;font-stretch:108%;letter-spacing:-.03em;text-transform:uppercase}
p{margin:14px 0 0;color:#3D485C}
.stamp{display:inline-block;margin-top:18px;transform:rotate(-4deg);border:2.5px solid var(--stamp);color:var(--stamp);padding:4px 9px;font:700 11px/1.2 "IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;border-radius:3px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:4px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--rule);color:var(--fg)}
a.primary{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="lbl">Alvin Diaz Merasol · LPT, MBA</span>
  <div class="sheet" style="margin-top:40px">
    <span class="tab" aria-hidden="true">Error 404</span>
    <h1>This file isn't in the cabinet.</h1>
    <p>The page you followed has moved or never existed. Everything on the site lives on one page, so the projects, case studies and résumé are all a click away.</p>
    <span class="stamp">Not found</span>
  </div>
  <nav class="links" aria-label="Where to go next">
    <a class="primary" href="/website/">Go to the portfolio</a>
    <a href="/website/#projects">See projects</a>
    <a href="/website/#contact">Contact</a>
  </nav>
</main>
<script src="/website/assets/js/chibi.js" data-page="404"></script>
</body>
</html>
